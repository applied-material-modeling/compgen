name: Enforce code style, linting, and run basic tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check license headers
        run: python scripts/check_license.py
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install -e .[dev]
      - name: Run black
        run: black --check .
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          pip install -e .[dev,mcrpy]
          # CPU-only wheel: the default Linux CUDA wheel bundles triton, whose
          # native module segfaults on the GPU-less runner (imported lazily by
          # torch.optim on the impenetrable-particle path). The CPU build has no
          # triton dependency, so it avoids the crash and installs faster.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run tests
        run: pytest --ignore=tests/verification
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install -e .[dev]
      - name: Run pylint on module and tests
        run: pylint compgen tests scripts
