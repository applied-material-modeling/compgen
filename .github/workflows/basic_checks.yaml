name: Enforce code style, linting, and run basic tests

on: [push, pull_request]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install -e .[dev]
      - name: Run black
        run: black --check .
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install -e .[dev,mcrpy]
      - name: Run tests
        run: pytest --ignore=tests/verification
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install -e .[dev]
      - name: Run pylint on module and tests
        run: pylint compgen tests
