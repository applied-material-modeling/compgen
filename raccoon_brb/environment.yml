# Environment name: moose
# path/prefix: /home/bbrunsvik/environments/moose

# Create the environment with: 
# conda env create -f environment.yml -p /home/bbrunsvik/environments/moose

# Update the environment with: 
# conda env update -f environment.yml -p /home/bbrunsvik/environments/moose

channels:
  - https://conda.software.inl.gov/public
  - conda-forge

dependencies:

  # Install most Moose dependencies based on Raccoon installation instructions. 
  - moose-dev=2026.10.19=mpich

  # Install things required for Compgen. These are taken from the requirements.txt file. 
  - numpy
  - scipy
  - h5py
  - hdf5plugin # Possibly relevant for compression and other hdf5 things. 
  - matplotlib
  - scikit-image
  - tqdm
  - gstools
  - multiprocess
  - pytest
  - pyvista

  # Pip dependencies
  - pip
  - pip:
    # exodus needed for Compgen. 
    - git+https://github.com/sandialabs/exodusii.git@main



